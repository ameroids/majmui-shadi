<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Majmui Shaadi – Splash</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--green:#11352f;--green2:#0d2b26;--gold:#c9a24b;--gold-soft:#e6cf8f;--cream:#faf6ef;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--green2)}
body{font-family:'Inter',system-ui,sans-serif;overflow:hidden}
.splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
 background:radial-gradient(circle at 50% 45%,var(--green) 0%,var(--green2) 75%);color:var(--cream);
 padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);transition:opacity .8s ease,transform .8s ease}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.ring{position:absolute;left:50%;top:46%;border:1px solid var(--gold);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.8);
 animation:ring 2s ease forwards}
.r1{width:min(80vw,640px);height:min(80vw,640px);animation-delay:.1s;--o:.16}
.r2{width:min(110vw,900px);height:min(110vw,900px);animation-delay:.4s;--o:.09}
.r3{width:min(145vw,1200px);height:min(145vw,1200px);animation-delay:.7s;--o:.05}
@keyframes ring{to{opacity:var(--o);transform:translate(-50%,-50%) scale(1)}}
.center{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.orn{width:min(300px,70vw);height:20px;opacity:0;animation:fade 1s ease forwards}
.orn.top{animation-delay:.6s}.orn.bot{animation-delay:2.2s}
.orn line{stroke:var(--gold);stroke-width:1;opacity:.7}
.orn path,.orn circle{fill:var(--gold)}
.rings{width:64px;height:40px;overflow:visible}
.rings circle{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.4s ease forwards}
.rings circle:nth-child(2){animation-delay:.35s}
@keyframes draw{to{stroke-dashoffset:0}}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(40px,8vw,64px);letter-spacing:.04em;
 opacity:0;transform:translateY(10px);animation:rise 1.1s ease 1.1s forwards}
.tag{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(22px,4vw,32px);color:var(--gold-soft);line-height:1.3;
 opacity:0;animation:fade 1.1s ease 1.7s forwards}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
.loader{width:120px;height:1px;background:rgba(201,162,75,.2);margin-top:14px;overflow:hidden;opacity:0;animation:fade .6s ease 2.2s forwards}
.loader i{display:block;height:100%;width:100%;background:var(--gold);transform:translateX(-100%);animation:load 1.6s ease 2.3s forwards}
@keyframes load{to{transform:none}}
.credit{text-align:center;margin-top:-4px;opacity:0;animation:fade 1s ease 2.6s forwards}
.credit small{display:block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(250,246,239,.5);margin-bottom:6px}
.credit b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:19px;letter-spacing:.08em;color:var(--gold-soft)}
.replay{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:5;background:none;border:1px solid rgba(201,162,75,.4);
 color:var(--gold-soft);font:500 12px 'Inter',sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer;opacity:.7}
.replay:hover{opacity:1}
.next{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#faf6ef;color:#11352f;
 font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;z-index:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="next">Sign in →</div>
<button class="replay" id="replay">Replay</button>

<div class="splash" id="splash">
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
  <div class="center">
    <svg class="orn top" viewBox="0 0 300 20"><line x1="0" y1="10" x2="125" y2="10"/><line x1="175" y1="10" x2="300" y2="10"/>
      <path d="M150 0 L154 8 L162 10 L154 12 L150 20 L146 12 L138 10 L146 8Z"/><circle cx="130" cy="10" r="1.6"/><circle cx="170" cy="10" r="1.6"/></svg>
    <svg class="rings" viewBox="0 0 64 40"><circle cx="24" cy="20" r="15" pathLength="100"/><circle cx="40" cy="20" r="15" pathLength="100"/></svg>
    <h1>Majmui Shaadi</h1>
    <p class="tag">Every family,<br>personally invited.</p>
    <div class="loader"><i></i></div>
    <svg class="orn bot" viewBox="0 0 300 20"><line x1="0" y1="10" x2="125" y2="10"/><line x1="175" y1="10" x2="300" y2="10"/>
      <path d="M150 0 L154 8 L162 10 L154 12 L150 20 L146 12 L138 10 L146 8Z"/><circle cx="130" cy="10" r="1.6"/><circle cx="170" cy="10" r="1.6"/></svg>
    <div class="credit"><small>Developed by</small><b>Ameroids Tech Studio</b></div>
  </div>
</div>

<script>
var splash=document.getElementById('splash'),t;
function run(){
  clearTimeout(t);
  splash.classList.remove('out');
  var c=splash.cloneNode(true);splash.parentNode.replaceChild(c,splash);splash=c;
  t=setTimeout(function(){splash.classList.add('out');},4400); // then redirect to login here
}
document.getElementById('replay').onclick=run;
t=setTimeout(function(){splash.classList.add('out');},4400);
</script>
</body>
</html>
